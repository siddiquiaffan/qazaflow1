name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  build:
    name: Release build (arm64-v8a)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Build arm64 release APK
        id: build
        uses: ./.github/actions/build-android
        with:
          abis: arm64-v8a
          name: arm64-v8a
          google-web-client-id: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v5
        with:
          name: qazaflow-arm64-v8a
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
